  function legHTML(name, cls, leg) {
    if (!leg) return `<div class="leg-head"><h2>${name}</h2></div><p class="meta">No path.</p>`;
    return `<div class="leg-head"><h2>${name}</h2><span class="t">${fmt2(leg.ms)} ms</span></div>
      <div class="hops">${hops(leg.p)}</div>
      <p class="meta">${leg.p.length - 1} hop${leg.p.length === 2 ? "" : "s"} · one-way propagation estimate</p>`;
  }

  function render() {
    $("sel-a").value = state.a;
    if (state.z) $("sel-z").value = state.z;
    Object.values(linkEls).forEach(o => o.ln.setAttribute("class", "ln"));
    gLabels.innerHTML = "";
    Object.entries(nodeEls).forEach(([id, o]) => o.g.setAttribute("class", "nd" + (id === state.a || id === state.z ? " end" : "")));
    svg.querySelectorAll(".endlbl").forEach(e => e.remove());

    const endLbl = (id, txt) => { const o = nodeEls[id]; const t = el("text", { x: o.x, y: o.y + 34, class: "endlbl" }); t.textContent = txt; };
    endLbl(state.a, "A-END");
    if (!state.z) {
      $("hint").textContent = `A-end set to ${state.a}. Click another POP to set the Z-end.`;
      $("verdict").innerHTML = `<p class="note">Choose a Z-end to plan paths from <strong>${state.a}</strong>.</p>`;
      $("leg-a").innerHTML = legHTML("Path A", "a", null); $("leg-b").innerHTML = legHTML("Path B", "b", null);
      $("alts").innerHTML = ""; return;
    }
    endLbl(state.z, "Z-END");
    $("hint").textContent = "Click a POP to start a new A-end, then another for the Z-end.";

    const r = eng.diversePair(state.a, state.z, state.skew, state.metro ? 25 : 0);
    let A = r.A, B = r.B, skew = r.skew, status = r.status;
    if (state.choice != null && r.pairs.length) {
      const rows = topPairs(r);
      const c = rows[state.choice];
      if (c) { [A, B] = r.orient(c); skew = B.ms - A.ms; status = c.ok ? "OK" : "OVER SKEW BUDGET"; }
    }

    const draw = (leg, cls) => {
      if (!leg) return;
      leg.p.slice(1).forEach((v, i) => {
        const o = linkEls[leg.p[i] + "|" + v]; o.ln.setAttribute("class", "ln " + cls);
        gLinks.appendChild(o.ln);
        const mx = (o.x1 + o.x2) / 2, my = (o.y1 + o.y2) / 2, txt = fmt(o.l.ms) + " ms";
        const g = el("g", { class: "ms" }, gLabels), w = txt.length * 6.8 + 10;
        el("rect", { x: mx - w / 2, y: my - 9, width: w, height: 18, rx: 4,
                     style: `stroke: var(--path-${cls})` }, g);
        const t = el("text", { x: mx, y: my }, g); t.textContent = txt;
      });
    };
    draw(A, "a"); draw(B, "b");

    if (!A) {
      $("verdict").innerHTML = `<span class="pill bad">No diverse pair</span>
        <p class="note">Every route from ${r.a} to ${r.z} shares a POP or link with every other route${state.metro ? " (or the same metro site)" : ""}.</p>`;
      $("leg-a").innerHTML = legHTML("Path A", "a", null); $("leg-b").innerHTML = legHTML("Path B", "b", null);
      $("alts").innerHTML = ""; return;
    }
    const ok = status === "OK";
    const pct = Math.min(100, state.skew > 0 ? skew / state.skew * 100 : (skew > 0 ? 100 : 0));
    let fastNote = "";
    if (r.fastest && r.fastest !== r.pick && state.choice == null) {
      const [fa, fb] = r.orient(r.fastest);
      fastNote = `<p class="note">The fastest diverse pair is <strong>${fmt2(fa.ms)} / ${fmt2(fb.ms)} ms</strong>, but its skew of ${fmt2(fb.ms - fa.ms)} ms is over budget.</p>`;
    }
    $("verdict").innerHTML = `
      <span class="pill ${ok ? "ok" : "bad"}">${ok ? "Within skew budget" : "Over skew budget"}</span>
      <div class="skew"><b>${fmt2(skew)} ms</b><span>A/B skew · budget ${state.skew} ms</span></div>
      <div class="bar" aria-hidden="true"><i class="${ok ? "" : "bad"}" style="width:${pct}%"></i></div>
      ${ok ? "" : `<p class="note">No disjoint pair fits ${state.skew} ms, so this is the lowest-skew pair. Raise the receivers' buffer or add a route.</p>`}
      ${fastNote}
      <p class="meta">${r.simplePaths} routes · ${r.disjointPairs} diverse pairs · single shortest route ${fmt2(r.shortest.ms)} ms</p>`;
    $("leg-a").innerHTML = legHTML("Path A", "a", A);
    $("leg-b").innerHTML = legHTML("Path B", "b", B);

    const rows = topPairs(r);
    const curA = A.p.join(), curB = B.p.join();
    $("alts").innerHTML = `<thead><tr><th>#</th><th class="num">A ms</th><th class="num">B ms</th><th class="num">Skew</th><th>Path B via</th></tr></thead><tbody>` +
      rows.map((c, i) => {
        const [x, y] = r.orient(c), sel = x.p.join() === curA && y.p.join() === curB;
        return `<tr class="pick ${sel ? "sel" : ""}" data-i="${i}" tabindex="0" title="Show this pair">
          <td>${i + 1}</td><td class="num">${fmt2(x.ms)}</td><td class="num">${fmt2(y.ms)}</td>
          <td class="num" style="color:var(${c.ok ? "--ok" : "--warn"})">${fmt2(c.skew)}</td>
          <td>${y.p.slice(1, -1).join(" · ") || "direct"}</td></tr>`;
      }).join("") + "</tbody>";
    $("alts").querySelectorAll("tr.pick").forEach(tr => {
      const go = () => { state.choice = +tr.dataset.i; render(); };
      tr.addEventListener("click", go);
      tr.addEventListener("keydown", e => { if (e.key === "Enter") go(); });
    });
  }
  function topPairs(r) {
    // in-budget pairs first, then by worst-path latency
    return [...r.pairs].sort((x, y) => (y.ok - x.ok) || (x.key[0] - y.key[0]) || (x.key[1] - y.key[1]) || (x.key[2] - y.key[2])).slice(0, 6);
  }

  $("foot").textContent = `Latency is an estimate: great-circle distance × ${DATA.route_factor} route factor × ${DATA.fiber} µs/km in fiber, one way, propagation only. ` +
    `Skew is the delay difference between path A and path B that the 2022-7 receivers must buffer. The 25 km option groups nearby POPs (DRT/ASH, HAL1/SEC1, DEN/DRY) so A and B can't both rely on the same metro.`;
  render();
})();
</script>
